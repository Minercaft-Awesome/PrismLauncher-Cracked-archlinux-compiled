name: Build Arch Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-arch.yml'

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root

    steps:
      - name: Initialize Pacman & Install All Dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          for i in $(seq 1 10); do
            echo "Attempt $i/10: Installing PrismLauncher Arch dependencies..."
            pacman -Syu --noconfirm --needed \
              git \
              cmake \
              ninja \
              extra-cmake-modules \
              qt6-base \
              qt6-5compat \
              qt6-networkauth \
              qt6-svg \
              qt6-imageformats \
              quazip-qt6 \
              cmark \
              tomlplusplus \
              zlib \
              libarchive \
              qrencode \
              gamemode \
              vulkan-headers \
              scdoc \
              hicolor-icon-theme \
              mesa \
              libglvnd \
              jdk17-openjdk && break
            echo "Pacman failed on attempt $i, retrying in 5s..."
            sleep 5
          done

          archlinux-java set java-17-openjdk || true

      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch Git Submodules Safely
        run: |
          git config --global --add safe.directory '*'
          for i in $(seq 1 10); do
            echo "Attempt $i/10: Fetching git submodules..."
            git submodule update --init --recursive && break
            echo "Submodule fetch failed, retrying in 5s..."
            sleep 5
          done

      - name: Configure & Compile with Ninja
        run: |
          useradd -m builder || true
          chown -R builder:builder .

          su builder -c '
            set -e
            git config --global --add safe.directory "*"
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
            export PATH="$JAVA_HOME/bin:$PATH"

            mkdir -p build && cd build

            if ! cmake .. -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DLauncher_BUILD_PLATFORM=archlinux \
              -DLauncher_QT_VERSION_MAJOR=6 \
              -DJava_JAVA_EXECUTABLE=/usr/lib/jvm/java-17-openjdk/bin/java \
              -DJava_JAVAC_EXECUTABLE=/usr/lib/jvm/java-17-openjdk/bin/javac; then
              echo "Ninja configure failed, falling back to Unix Makefiles..."
              rm -rf *
              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DLauncher_BUILD_PLATFORM=archlinux \
                -DLauncher_QT_VERSION_MAJOR=6 \
                -DJava_JAVA_EXECUTABLE=/usr/lib/jvm/java-17-openjdk/bin/java \
                -DJava_JAVAC_EXECUTABLE=/usr/lib/jvm/java-17-openjdk/bin/javac
            fi

            cmake --build . -j$(nproc) || cmake --build . -j2 || cmake --build . -j1
          '

      - name: Package Compiled Binaries
        run: |
          DESTDIR="$PWD/pkg" cmake --install build
          tar -cJf prismlauncher-cracked-arch.tar.xz -C pkg .
          ls -lh prismlauncher-cracked-arch.tar.xz

      - name: Upload Compiled Archive
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-cracked-arch
          path: prismlauncher-cracked-arch.tar.xz
          retention-days: 30
